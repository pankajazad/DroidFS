name: Build arm64 native libraries (search branch)

on:
  workflow_dispatch:
  push:
    branches:
      - search
    paths:
      - '.gitmodules'
      - 'app/ffmpeg/**'
      - 'app/libgocryptfs/**'
      - '.github/workflows/build-native-libs-search.yml'

permissions:
  contents: read

concurrency:
  group: native-libs-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout branch and submodules
        uses: actions/checkout@v4
        with:
          ref: search
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git wget yasm nasm autoconf automake libtool

      - name: Build arm64 FFmpeg libraries
        run: |
          cd app/ffmpeg
          chmod +x build.sh
          ./build.sh arm64-v8a

      - name: Build arm64 libgocryptfs
        run: |
          cd app/libgocryptfs
          chmod +x build.sh
          ./build.sh arm64-v8a

      - name: Verify expected native outputs
        run: |
          test -f app/ffmpeg/build/arm64-v8a/libavformat/libavformat.so
          test -f app/ffmpeg/build/arm64-v8a/libavcodec/libavcodec.so
          test -f app/ffmpeg/build/arm64-v8a/libavutil/libavutil.so
          test -f app/libgocryptfs/build/arm64-v8a/libgocryptfs.so

      - name: Create reusable native library bundle
        run: |
          mkdir -p native-bundle/app/ffmpeg/build native-bundle/app/libgocryptfs/build
          cp -a app/ffmpeg/build/arm64-v8a native-bundle/app/ffmpeg/build/
          cp -a app/libgocryptfs/build/arm64-v8a native-bundle/app/libgocryptfs/build/
          cp .gitmodules native-bundle/
          git submodule status --recursive > native-bundle/submodule-commits.txt
          printf 'ABI=arm64-v8a\nNDK=28.2.13676358\n' > native-bundle/build-info.txt
          tar -czf DroidFS-native-arm64-${GITHUB_SHA}.tar.gz -C native-bundle .

      - name: Upload reusable native libraries
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DroidFS-native-arm64-${{ github.sha }}
          path: DroidFS-native-arm64-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Publish bundle link
        if: success()
        run: |
          echo "## DroidFS arm64 native libraries" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download reusable native bundle](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contains FFmpeg and libgocryptfs arm64-v8a outputs." >> "$GITHUB_STEP_SUMMARY"
          echo "- CryFS is built by Gradle/CMake and is not included in this bundle." >> "$GITHUB_STEP_SUMMARY"
