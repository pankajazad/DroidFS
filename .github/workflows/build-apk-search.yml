name: Build APK (search branch)

on:
  push:
    branches:
      - search
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout branch and submodules
        uses: actions/checkout@v4
        with:
          ref: search
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git gnupg2 wget npm yasm nasm autoconf automake libtool

      - name: Build FFmpeg
        run: |
          cd app/ffmpeg
          chmod +x build.sh
          ./build.sh

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DroidFS-search-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish download link
        if: success()
        run: |
          echo "## DroidFS APK build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `search`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `${GITHUB_SHA}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download APK artifact](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The artifact contains the release APKs for the branch head. The link is available from this workflow run and expires after 30 days."
